[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "labse-research"
version = "1.0.0"
description = "Cross-lingual LaBSE fine-tuning research pipeline for Indic-Indic alignment"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
